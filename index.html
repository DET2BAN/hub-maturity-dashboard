<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSH Hub Maturity Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --navy:#0d1f3c;--red:#c8102e;--accent:#d97706;--green:#16a34a;--danger:#dc2626;
  --l1c:#dc2626;--l1b:#fef2f2;--l2c:#d97706;--l2b:#fffbeb;--l3c:#16a34a;--l3b:#f0fdf4;--l4c:#2563eb;--l4b:#eff6ff;
  --bdr:#e2e8f0;--bg:#f5f7fa;--text:#0d1f3c;--mid:#4a5568;--light:#718096;--white:#fff;--off:#f7fafc;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}

/* TOP HEADER */
.header{background:var(--navy);padding:16px 28px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0}
.brand-title{font-size:17px;font-weight:700;color:#fff;line-height:1.2}
.brand-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}

.breadcrumb{display:flex;align-items:center;gap:6px;flex:1;padding:0 20px}
.bc-sep{color:rgba(255,255,255,.2);font-size:16px}
.bc-item{font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;padding:4px 8px;border-radius:5px;transition:.2s;font-weight:500}
.bc-item:hover{background:rgba(255,255,255,.08);color:#fff}
.bc-item.active{color:#fff;font-weight:700;cursor:default}

.view-toggle{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:7px;padding:4px}
.v-btn{padding:6px 12px;background:transparent;color:rgba(255,255,255,.5);border:none;cursor:pointer;font-size:12px;font-weight:600;border-radius:5px;transition:.2s}
.v-btn.active{background:rgba(255,255,255,.18);color:#fff}

/* MAIN */
.main{max-width:1400px;margin:0 auto;padding:24px}

/* SECTION */
.section{margin-bottom:32px}
.section-title{font-size:17px;font-weight:700;margin-bottom:5px}
.section-sub{font-size:13px;color:var(--light);margin-bottom:18px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.kpi{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.kpi-label{font-size:11px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.kpi-val{font-size:32px;font-weight:700;line-height:1;margin-bottom:6px}
.kpi-sub{font-size:13px;color:var(--mid)}
.kpi-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-top:8px}

/* LEVEL BADGES */
.lv-l1{color:var(--l1c);background:var(--l1b)}
.lv-l2{color:var(--l2c);background:var(--l2b)}
.lv-l3{color:var(--l3c);background:var(--l3b)}
.lv-l4{color:var(--l4c);background:var(--l4b)}

/* CHART WRAPPER */
.chart-wrap{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:20px;margin-bottom:28px;position:relative}
.chart-title{font-size:13px;font-weight:700;color:var(--mid);margin-bottom:14px}
.chart-inner{position:relative;height:260px}

/* CHARTS 2COL */
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}

/* THEME GRID */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:28px}
.tc{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:18px}
.tc-icon{font-size:22px;margin-bottom:10px}
.tc-name{font-size:12px;font-weight:700;color:var(--mid);min-height:32px;margin-bottom:10px}
.tc-score{font-size:26px;font-weight:700;margin-bottom:8px}
.tc-bar{height:5px;background:#e5e7eb;border-radius:3px;margin-bottom:8px;overflow:hidden}
.tc-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.tc-lv{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;display:inline-block}

/* CARDS / GRID VIEW */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.card.drill::after{content:"›";position:absolute;right:16px;top:16px;font-size:20px;color:var(--light);font-weight:700}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.card-name{font-size:14px;font-weight:700}
.card-meta{font-size:11px;color:var(--light);margin-top:3px}
.card-score-block{text-align:center}
.cscore{font-size:28px;font-weight:700;line-height:1}
.clv{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;display:block;margin-top:4px;text-align:center}
.card-divider{height:1px;background:var(--bdr);margin-bottom:12px}
.card-list{display:flex;flex-direction:column;gap:7px}
.card-li{font-size:12px;color:var(--mid);padding:5px 0;border-bottom:1px dashed var(--bdr)}
.card-li:last-child{border-bottom:none}

/* TABLE VIEW */
.tbl-wrap{background:var(--white);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.tbl-wrap table{width:100%;border-collapse:collapse}
.tbl-wrap th{background:var(--off);padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--bdr)}
.tbl-wrap td{padding:12px 16px;border-bottom:1px solid var(--bdr);font-size:13px}
.tbl-wrap tr:last-child td{border-bottom:none}
.tbl-wrap tr.clicky{cursor:pointer;transition:.15s}
.tbl-wrap tr.clicky:hover{background:var(--off)}
.lv-badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.pbar{display:flex;align-items:center;gap:8px}
.ptrack{flex:1;height:6px;background:var(--bdr);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:var(--accent)}

/* RADAR / ATTRIBUTE LIST */
.attr-list{display:flex;flex-direction:column;gap:8px}
.attr-item{background:var(--white);border:1px solid var(--bdr);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.attr-item.crit{border:2px solid rgba(220,38,38,.3);background:#fff5f5}
.attr-name{font-size:13px;font-weight:600;flex:1}
.attr-name.cn{color:var(--l1c);font-weight:700}
.attr-bar{flex:2;position:relative}
.attr-track{height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden;position:relative}
.attr-track.crit-t{background:#fee2e2}
.attr-fill{height:100%;border-radius:5px;transition:width .6s}
.attr-mark{position:absolute;left:62.5%;top:-2px;bottom:-2px;width:2px;background:rgba(22,163,74,.5)}
.attr-val{font-size:15px;font-weight:700;min-width:40px;text-align:right}
.attr-lv{min-width:58px}

/* DETAIL VIEW */
.detail-hdr{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.dhd-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
.dhd-cluster{font-size:13px;color:var(--mid);margin-bottom:16px}
.dhd-meta{display:flex;gap:24px;flex-wrap:wrap}
.meta-item{display:flex;flex-direction:column}
.meta-lbl{font-size:10px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.meta-val{font-size:13px;font-weight:600}
.dhd-score{text-align:center;background:var(--off);border-radius:12px;padding:24px 32px;flex-shrink:0}
.dhd-num{font-size:52px;font-weight:700;line-height:1;margin-bottom:8px}
.dhd-level-label{font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;display:inline-block}

/* ACTION PLAN */
.action-card{background:var(--l3b);border:1px solid rgba(22,163,74,.2);border-radius:12px;padding:20px}
.action-card h3{color:var(--l3c);font-size:14px;margin-bottom:14px}
.action-list{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:0;list-style:none}
.action-list li{font-size:13px;color:var(--mid);line-height:1.5;display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(22,163,74,.08)}
.action-list li:last-child{border-bottom:none}
.action-list li::before{content:"✦";color:var(--l3c);font-size:10px;margin-top:3px;flex-shrink:0}

/* INSIGHT BOX */
.insight-box{background:rgba(200,16,46,.04);border:1px solid rgba(200,16,46,.15);border-radius:10px;padding:14px 16px;margin-top:14px}
.insight-box p{font-size:13px;color:var(--mid);line-height:1.6}
.insight-box strong{color:var(--text)}

/* GRID INSIGHT */
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.ins-card{background:var(--white);border:1px solid var(--bdr);border-radius:12px;padding:18px}
.ins-card.crit{border-color:rgba(220,38,38,.25);background:#fff9f9}
.ins-card h3{font-size:13px;font-weight:700;margin-bottom:10px}
.ins-card h3.cr{color:var(--l1c)}
.ins-card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.ins-card ul li{font-size:12px;color:var(--mid);display:flex;gap:7px;line-height:1.45}
.ins-card ul li::before{content:"→";color:var(--l2c);font-size:11px;flex-shrink:0;margin-top:1px}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--white);color:var(--mid);border:1px solid var(--bdr);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;margin-bottom:20px}
.back-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ANIM */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.content-area{animation:fadeUp .3s ease-out}

/* RESPONSIVE */
@media(max-width:768px){
  .charts-2col{grid-template-columns:1fr}
  .insight-grid{grid-template-columns:1fr}
  .detail-hdr{flex-direction:column}
  .header{flex-wrap:wrap}
}
</style>
</head>
<body>

</header>

<main class="main">

// ─── STATE ───────────────────────────────────────────────────────────
let state = { level:"hub", clusterId:null, teamId:null, view:"cards" };
let charts = {};

function lvClass(l){ return l==="L1"?"lv-l1":l==="L2"?"lv-l2":l==="L3"?"lv-l3":"lv-l4"; }
function lvName(s){ return s<1.5?"L1":s<2.5?"L2":s<3.5?"L3":"L4"; }
function getLevelLabel(l){
  const m={L1:"Execution Hub",L2:"Capability Hub",L3:"Strategic Partner",L4:"Transformation Engine"};
  return m[l]||"";
}
function scoreColor(s){ return s<1.5?"#dc2626":s<2.5?"#d97706":s<3.5?"#16a34a":"#2563eb"; }

// ─── NAV ─────────────────────────────────────────────────────────────
function nav_hub(){ state={...state,level:"hub",clusterId:null,teamId:null}; render(); }
function nav_cluster(id){ state={...state,level:"cluster",clusterId:id,teamId:null}; render(); }
function nav_team(id){ state={...state,level:"team",teamId:id}; render(); }
function setView(v){
  state.view=v;
  document.querySelectorAll(".v-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".v-btn")[v==="cards"?0:1].classList.add("active");
  render();
}

// ─── BREADCRUMB ───────────────────────────────────────────────────────
function renderBreadcrumb(){
  const bc = document.getElementById("breadcrumb");
  let html = `<span class="bc-item ${state.level==="hub"?"active":""}" onclick="nav_hub()">Hub Overview</span>`;
  if(state.clusterId){
    const c = DATA.clusters.find(x=>x.id===state.clusterId);
    html += `<span class="bc-sep">›</span><span class="bc-item ${state.level==="cluster"?"active":""}" onclick="nav_cluster('${state.clusterId}')">${c.name}</span>`;
  }
  if(state.level==="team" && state.teamId){
    const t = DATA.teams[state.teamId];
    html += `<span class="bc-sep">›</span><span class="bc-item active">${t.name}</span>`;
  }
  bc.innerHTML = html;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────
function render(){
  destroyCharts();
  renderBreadcrumb();
  const ca = document.getElementById("contentArea");
  if(state.level==="hub") ca.innerHTML = renderHub();
  else if(state.level==="cluster") ca.innerHTML = renderCluster();
  else ca.innerHTML = renderTeam();
  requestAnimationFrame(()=>{ renderCharts(); });
}

function themeCard(t){
  const pct=(t.score/4)*100;
  const lv=lvName(t.score);
  const color=scoreColor(t.score);
  return `<div class="tc">
    <div class="tc-icon">${t.icon||"📊"}</div>
    <div class="tc-name">${t.name}</div>
    <div class="tc-score" style="color:${color}">${t.score.toFixed(2)}</div>
    <div class="tc-bar"><div class="tc-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <span class="tc-lv ${lvClass(lv)}">${lv} · ${getLevelLabel(lv)}</span>
  </div>`;
}

function renderClusterCards(){
  return `<div class="cards-grid">${DATA.clusters.map(c=>`
    <div class="card drill" onclick="nav_cluster('${c.id}')">
      <div class="card-top">
        <div><div class="card-name">${c.name}</div><div class="card-meta">${c.teams.length} teams</div></div>

function renderAttrList(attrs){
  const sorted=[...attrs].sort((a,b)=>b.score-a.score);
  return `<div class="attr-list">${sorted.map(a=>{
    const pct=(a.score/4)*100;
    const lv=lvName(a.score);
    const color=scoreColor(a.score);
    return `<div class="attr-item ${a.critical?"crit":""}">
      <div class="attr-name ${a.critical?"cn":""}">${a.name}${a.critical?" 🔴":""}</div>
      <div class="attr-bar">
        <div class="attr-track ${a.critical?"crit-t":""}">
          <div class="attr-fill" style="width:${pct}%;background:${color}"></div>
          <div class="attr-mark"></div>
        </div>
      </div>
      <div class="attr-val" style="color:${color}">${a.score.toFixed(2)}</div>
      <div class="attr-lv"><span class="lv-badge ${lvClass(lv)}">${lv}</span></div>
    </div>`;
  }).join("")}</div>`;
}

      ${renderAttrList(c.attributes)}
    </div>

    <div class="insight-grid">
      <div class="ins-card crit">
        <h3 class="cr">🔴 Critical Focus Areas</h3>
        <ul>${c.attributes.filter(a=>a.critical).map(a=>`<li>${a.name} — Score: ${a.score} (${a.subLabel})</li>`).join("")}</ul>
      </div>
      <div class="ins-card">
        <h3>💪 Strengths</h3>
        <ul>${[...c.attributes].sort((a,b)=>b.score-a.score).slice(0,3).map(a=>`<li>${a.name} — Score: ${a.score} (${a.subLabel})</li>`).join("")}</ul>
      </div>
    </div>

    <div class="action-card">
      <h3>Recommended Action Plan for ${c.name}</h3>
      <ul class="action-list">${c.actionItems.map(a=>`<li>${a}</li>`).join("")}</ul>
    </div>

    <div class="insight-box" style="margin-top:16px">
      <p><strong>Cluster Insight:</strong> ${c.insight}</p>
    </div>
  `;
}

function renderTeamCardsForCluster(cluster, teamsList){
  if(teamsList.length === 0){
    return `<div class="cards-grid"><div class="card" style="cursor:default"><p style="color:var(--light)">No team-level data available for this cluster.</p></div></div>`;
  }
  return `<div class="cards-grid">${teamsList.map(t=>`
    <div class="card drill" onclick="nav_team('${t.id}')">
      <div class="card-top">
        <div>
          <div class="card-name">${t.name}</div>
          <div class="card-meta">Owner: ${t.owner} · ${t.date}</div>
        </div>
        <div class="card-score-block">
          <div class="cscore" style="color:${scoreColor(t.score)}">${t.score.toFixed(2)}</div>
          <span class="clv ${lvClass(t.level)}">${t.level}</span>
        </div>
      </div>
      <div class="card-divider"></div>
      <div style="font-size:12px;color:var(--mid);display:flex;justify-content:space-between;align-items:center">
        <span>${t.parameters.filter(p=>p.critical).length > 0 ? '🔴 '+t.parameters.filter(p=>p.critical).length+' critical param'+(t.parameters.filter(p=>p.critical).length>1?'s':'') : '✅ No critical gaps'}</span>
        <span style="color:var(--accent);font-weight:700">View details →</span>
      </div>
    </div>
  `).join("")}</div>`;
}

// ─── TEAM VIEW ────────────────────────────────────────────────────────
function renderTeam(){
  const t = DATA.teams[state.teamId];
  if(!t) return "<p>Team not found</p>";
  const critParams = t.parameters.filter(p=>p.critical);

  return `
    <button class="back-btn" onclick="nav_cluster('${t.clusterId}')">← ${t.cluster}</button>

    <div class="detail-hdr">
      <div class="dhd-info">
        <h2>${t.name}</h2>
        <div class="dhd-cluster">Cluster: ${t.cluster}</div>
        <div class="dhd-meta">
          <div class="meta-item"><span class="meta-lbl">Shape Owner</span><span class="meta-val">${t.owner}</span></div>
          <div class="meta-item"><span class="meta-lbl">SGL Name</span><span class="meta-val">${t.sgl}</span></div>
          <div class="meta-item"><span class="meta-lbl">Assessment Date</span><span class="meta-val">${t.date}</span></div>
        </div>
      </div>
      <div class="dhd-score">
        <div class="dhd-num" style="color:${scoreColor(t.score)}">${t.score.toFixed(2)}</div>
        <div style="font-size:12px;color:var(--light);margin-bottom:8px">Overall Score</div>
        <span class="dhd-level-label ${lvClass(t.level)}">${t.level} · ${t.label}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Theme Scores</div>
      <div class="theme-grid">
        ${t.themes.map((th,i)=>themeCard({...th,icon:["🏆","🚀","⚙️","💎"][i]})).join("")}
      </div>
    </div>

    <div class="charts-2col">
      <div class="chart-wrap"><div class="chart-title">Parameter Radar — ${t.name}</div><div class="chart-inner"><canvas id="teamRadarChart"></canvas></div></div>
      <div class="chart-wrap"><div class="chart-title">Score vs. L3 Target (2.5)</div><div class="chart-inner"><canvas id="teamBarChart"></canvas></div></div>
    </div>

    <div class="section">
      <div class="section-title">Detailed Assessment — All 9 Parameters</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Theme</th><th>Parameter</th><th>KPI Measured</th><th>Score</th><th>Level</th></tr></thead>
          <tbody>${t.parameters.map(p=>`
            <tr style="${p.critical?"background:rgba(220,38,38,.03)":""}">
              <td style="font-size:12px;color:var(--light)">${p.theme}</td>
              <td><strong>${p.name}${p.critical?" 🔴":""}</strong></td>
              <td style="font-size:12px;color:var(--light)">${p.kpi}</td>
              <td style="font-weight:700;color:${scoreColor(p.score)}">${p.score}</td>
              <td><span class="lv-badge ${lvClass(p.level)}">${p.level} · ${p.subLabel}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="insight-grid">
      <div class="ins-card crit">
        <h3 class="cr">🔴 Critical Actions — AI Savviness (Score: ${t.actionPlan.ai.score})</h3>
        <div style="font-size:12px;color:var(--mid);margin-bottom:10px;line-height:1.5">${t.actionPlan.ai.rootCause}</div>
        <ul>${t.actionPlan.ai.actions.map(a=>`<li>${a}</li>`).join("")}</ul>
      </div>
      <div class="ins-card crit">
        <h3 class="cr">🔴 Critical Actions — Cost Stewardship (Score: ${t.actionPlan.cost.score})</h3>
        <div style="font-size:12px;color:var(--mid);margin-bottom:10px;line-height:1.5">${t.actionPlan.cost.rootCause}</div>
        <ul>${t.actionPlan.cost.actions.map(a=>`<li>${a}</li>`).join("")}</ul>
      </div>
    </div>

    <div class="insight-box">
      <p><strong>Team Insight:</strong> ${t.insight}</p>
      <p style="margin-top:8px;font-size:12px;color:var(--light)">Gap to L3 (2.5): ${(2.5 - t.score).toFixed(2)} points. Priority: bring AI Savviness and Cost Stewardship from L1 to L2+.</p>
    </div>
  `;
}

// ─── CHARTS ──────────────────────────────────────────────────────────
function destroyCharts(){
  Object.values(charts).forEach(c=>c.destroy());
  charts={};
}

function renderCharts(){
  if(state.level==="hub"){
    renderClusterBarChart();
    renderHubRadarChart();
  } else if(state.level==="cluster"){
    renderClusterThemeChart();
    renderClusterAttrChart();
  } else {
    renderTeamRadarChart();
    renderTeamBarChart();
  }
}

const CHART_DEFAULTS = {
  animation:{ duration:700 },
  plugins:{ legend:{ display:false }, tooltip:{ bodyFont:{size:12} } },
  scales:{
    r:{ min:0, max:4, ticks:{stepSize:1,font:{size:10},color:"#718096",backdropColor:"transparent"}, grid:{color:"rgba(0,0,0,.06)"}, pointLabels:{font:{size:10},color:"#4a5568"} }
  }
};

function renderClusterBarChart(){
  const el = document.getElementById("clusterBarChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const labels = DATA.clusters.map(c=>c.name.replace(" Cluster",""));
  const scores = DATA.clusters.map(c=>c.score);
  const colors = DATA.clusters.map(c=>`rgba(${c.colorHex},.8)`);
  charts.clusterBar = new Chart(ctx,{
    type:"bar",
    data:{ labels, datasets:[{
      data:scores, backgroundColor:colors, borderRadius:6,
      borderColor:DATA.clusters.map(c=>`rgba(${c.colorHex},1)`), borderWidth:2
    },{
      data:labels.map(()=>2.5), type:"line", label:"L3 Target",
      borderColor:"rgba(22,163,74,.5)", borderDash:[5,4], borderWidth:2,
      pointRadius:0, fill:false
    }]},
    options:{
      animation:{duration:700},
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:v=>`Score: ${v.formattedValue}`}} },
      scales:{
        y:{min:0,max:3,ticks:{stepSize:.5,font:{size:10}},grid:{color:"rgba(0,0,0,.04)"}},
        x:{ticks:{font:{size:10}},grid:{display:false}}
      }
    }
  });
}

function renderHubRadarChart(){
  const el = document.getElementById("hubRadarChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const attrs = DATA.hub.attributes;
  const labels = attrs.map(a=>a.name.length>18?a.name.substring(0,16)+"…":a.name);
  charts.hubRadar = new Chart(ctx,{
    type:"radar",
    data:{ labels, datasets:[{
      label:"Hub Score", data:attrs.map(a=>a.score),
      backgroundColor:"rgba(200,16,46,.12)", borderColor:"rgba(200,16,46,.7)",
      pointBackgroundColor:"rgba(200,16,46,.8)", borderWidth:2, pointRadius:4
    },{
      label:"L3 Target", data:attrs.map(()=>2.5),
      backgroundColor:"rgba(22,163,74,.05)", borderColor:"rgba(22,163,74,.4)",
      borderDash:[4,3], borderWidth:1.5, pointRadius:0
    }]},
    options:{...CHART_DEFAULTS, plugins:{legend:{display:true,position:"bottom",labels:{font:{size:10},boxWidth:12}}}}
  });
}

function renderClusterThemeChart(){
  const el = document.getElementById("clusterThemeChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const c = DATA.clusters.find(x=>x.id===state.clusterId);
  const hubThemes = DATA.hub.themes;
  const labels = c.themes.map(t=>t.name.split(" ").slice(0,2).join(" "));
  charts.clusterTheme = new Chart(ctx,{
    type:"bar",
    data:{ labels, datasets:[
      { label:"Cluster", data:c.themes.map(t=>t.score), backgroundColor:"rgba(200,16,46,.75)", borderRadius:5, borderWidth:0 },
      { label:"Hub Avg", data:hubThemes.map(t=>t.score), backgroundColor:"rgba(13,31,60,.25)", borderRadius:5, borderWidth:0 }
    ]},
    options:{
      animation:{duration:700},
      plugins:{legend:{display:true,position:"bottom",labels:{font:{size:10},boxWidth:12}}},
      scales:{
        y:{min:0,max:3,ticks:{stepSize:.5,font:{size:10}},grid:{color:"rgba(0,0,0,.04)"}},
        x:{ticks:{font:{size:10}},grid:{display:false}}
      }
    }
  });
}

function renderClusterAttrChart(){
  const el = document.getElementById("clusterAttrChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const c = DATA.clusters.find(x=>x.id===state.clusterId);
  const sorted = [...c.attributes].sort((a,b)=>b.score-a.score);
  charts.clusterAttr = new Chart(ctx,{
    type:"bar",
    data:{ labels:sorted.map(a=>a.name.split(" ").slice(0,2).join(" ")), datasets:[{
      data:sorted.map(a=>a.score),
      backgroundColor:sorted.map(a=>a.critical?"rgba(220,38,38,.75)":"rgba(217,119,6,.7)"),
      borderRadius:5, borderWidth:0
    },{
      data:sorted.map(()=>2.5), type:"line", borderColor:"rgba(22,163,74,.5)",
      borderDash:[5,4], borderWidth:2, pointRadius:0, fill:false
    }]},
    options:{
      indexAxis:"y",
      animation:{duration:700},
      plugins:{legend:{display:false}},
      scales:{
        x:{min:0,max:4,ticks:{stepSize:.5,font:{size:10}},grid:{color:"rgba(0,0,0,.04)"}},
        y:{ticks:{font:{size:10}},grid:{display:false}}
      }
    }
  });
}

function renderTeamRadarChart(){
  const el = document.getElementById("teamRadarChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const t = DATA.teams[state.teamId];
  const labels = t.parameters.map(p=>p.name.split(" ").slice(0,2).join(" "));
  charts.teamRadar = new Chart(ctx,{
    type:"radar",
    data:{ labels, datasets:[{
      label:t.name, data:t.parameters.map(p=>p.score),
      backgroundColor:"rgba(200,16,46,.12)", borderColor:"rgba(200,16,46,.7)",
      pointBackgroundColor:"rgba(200,16,46,.8)", borderWidth:2, pointRadius:4
    },{
      label:"L3 Target (2.5)", data:t.parameters.map(()=>2.5),
      backgroundColor:"rgba(22,163,74,.05)", borderColor:"rgba(22,163,74,.4)",
      borderDash:[4,3], borderWidth:1.5, pointRadius:0
    }]},
    options:{...CHART_DEFAULTS, plugins:{legend:{display:true,position:"bottom",labels:{font:{size:10},boxWidth:12}}}}
  });
}

function renderTeamBarChart(){
  const el = document.getElementById("teamBarChart");
  if(!el) return;
  const ctx = el.getContext("2d");
  const t = DATA.teams[state.teamId];
  const sorted = [...t.parameters].sort((a,b)=>b.score-a.score);
  charts.teamBar = new Chart(ctx,{
    type:"bar",
    data:{ labels:sorted.map(p=>p.name.split(" ").slice(0,2).join(" ")), datasets:[{
      data:sorted.map(p=>p.score),
      backgroundColor:sorted.map(p=>p.critical?"rgba(220,38,38,.8)":"rgba(13,31,60,.7)"),
      borderRadius:5, borderWidth:0
    },{
      data:sorted.map(()=>2.5), type:"line", borderColor:"rgba(22,163,74,.5)",
      borderDash:[5,4], borderWidth:2, pointRadius:0, fill:false
    }]},
    options:{
      indexAxis:"y",
      animation:{duration:700},
      plugins:{legend:{display:false}},
      scales:{
        x:{min:0,max:4,ticks:{stepSize:.5,font:{size:10}},grid:{color:"rgba(0,0,0,.04)"}},
        y:{ticks:{font:{size:10}},grid:{display:false}}
      }
    }
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
