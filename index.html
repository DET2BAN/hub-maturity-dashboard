<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSH GDS | Hub Maturity Dashboard 2025</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#0f172a;font-size:14px;line-height:1.55;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;background:none}
button:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.tabnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;padding-left:8px}
.tab-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;transition:all .18s ease}
.tab-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.tab-btn.active{background:#fff;color:#0c1e3c;border-color:#fff;box-shadow:0 4px 12px rgba(255,255,255,.12)}
:root{
  --navy:#0c1e3c;--bg:#f0f4f8;--surf:#fff;--surf2:#f8fafc;--bdr:#e2e8f0;
  --mid:#475569;--muted:#64748b;--sub:#94a3b8;
  --l1c:#b91c1c;--l1bg:#fef2f2;--l1bd:#fca5a5;--l1f:#dc2626;
  --l2c:#92400e;--l2bg:#fef3c7;--l2bd:#fcd34d;--l2f:#d97706;
  --l3c:#14532d;--l3bg:#f0fdf4;--l3bd:#86efac;--l3f:#16a34a;
  --l4c:#312e81;--l4bg:#eef2ff;--l4bd:#a5b4fc;--l4f:#4338ca;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 16px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.05);
  --sh3:0 8px 32px rgba(0,0,0,.13),0 4px 8px rgba(0,0,0,.06);
  --r:10px;--r2:14px;--r3:20px;
}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:999;background:var(--navy);box-shadow:0 2px 20px rgba(0,0,0,.3)}
.tb{max-width:1440px;margin:auto;padding:0 20px;height:52px;display:flex;align-items:center;gap:12px}
.tb-logo{width:34px;height:34px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:var(--navy);letter-spacing:-.5px;flex-shrink:0}
.tb-brand strong{display:block;color:#fff;font-size:14px;font-weight:700;line-height:1.2}
.tb-brand span{color:rgba(255,255,255,.4);font-size:10px}
.tb-sep{width:1px;height:22px;background:rgba(255,255,255,.15);flex-shrink:0}
.bc{display:flex;align-items:center;gap:5px;font-size:12px;flex:1;flex-wrap:wrap}
.bc-link{color:#93c5fd;font-size:12px;padding:0}
.bc-link:hover{color:#60a5fa;text-decoration:underline}
.bc-cur{color:#fff;font-weight:600;font-size:12px}
.bc-sep{color:rgba(255,255,255,.25);font-size:10px}
.tb-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap;flex-shrink:0}
.tb-pill strong{color:#fff}

/* VIEWS */
.view{display:none}
.view.active{display:block;animation:vfade .25s ease}
@keyframes vfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HOME */
#v-home{padding:20px;max-width:1440px;margin:0 auto}
#v-action-items{padding:20px;max-width:1440px;margin:0 auto}
.page-ttl{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:3px}
.page-ttl .hl{color:#f97316}
.page-sub{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:14px}
.action-shell{display:flex;flex-direction:column;gap:16px}
.action-card{overflow:hidden}
.focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.focus-card{background:linear-gradient(135deg,#ffffff,#f8fafc);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;box-shadow:var(--sh);min-height:150px}
.focus-card h3{font-size:16px;font-weight:900;color:#0f172a;line-height:1.3;margin:6px 0 8px}
.focus-card p{font-size:12.5px;color:var(--muted);line-height:1.7}
.mini-label{display:inline-block;background:#dbeafe;border:1px solid #bfdbfe;color:#1d4ed8;border-radius:999px;padding:4px 8px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.focus-count{display:inline-flex;align-items:center;border-radius:999px;background:#ecfeff;border:1px solid #a5f3fc;color:#0f766e;padding:4px 8px;font-size:11px;font-weight:800;margin-bottom:6px}
.action-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);box-shadow:var(--sh);padding:16px}
.summary-card h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
.kpi-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi-box{background:#f8fafc;border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.kpi-box .kpi-label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.kpi-box .kpi-value{font-size:28px;font-weight:900;color:#0f172a;letter-spacing:-1px}
.kpi-box .kpi-sub{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.focus-chart-wrap{padding:14px 12px 8px}
.focus-chart{display:flex;flex-direction:column;gap:10px}
.focus-row{display:grid;grid-template-columns:290px 1fr;align-items:center;column-gap:16px}
.focus-label{font-size:14px;font-weight:500;color:#1f2937;line-height:1.4;text-align:right;padding-right:10px}
.focus-track{position:relative;height:18px;border-radius:5px;background:#f1f5f9;border:1px solid #dfe7f1;overflow:hidden}
.focus-bar{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#2f8fe9,#0d6ec9);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.focus-bar.is-primary{background:linear-gradient(90deg,#0d6ec9,#0a5eb7)}
.focus-value{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#0f172a}
.chart-legend{display:flex;justify-content:center;margin-top:10px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.keyfindings{display:grid;grid-template-columns:1fr;gap:12px}
.keyfindings .summary-card{padding:20px}
.keyfindings h4{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#1d4ed8;margin-bottom:10px}
.keyfindings ul{padding-left:18px;display:flex;flex-direction:column;gap:8px;color:#0f172a;font-size:13px;line-height:1.7}
.keyfindings li strong{font-weight:800}
.priority-table,.cluster-table{width:100%;border-collapse:collapse;border-spacing:0;margin-top:8px}
.priority-table th,.priority-table td,.cluster-table th,.cluster-table td{border:1px solid var(--bdr);padding:10px 12px;text-align:left;vertical-align:top;font-size:12.5px}
.priority-table th,.cluster-table th{background:#f8fafc;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.priority-pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:800;border:1px solid #bfdbfe}
.priority-pill.alt{background:#e0f2fe;color:#0f766e;border-color:#a5f3fc}
.action-table,.learn-table{width:100%;border-collapse:collapse;border-spacing:0}
.action-table th,.action-table td,.learn-table th,.learn-table td{border:1px solid var(--bdr);padding:12px 10px;vertical-align:top;text-align:left}
.action-table th,.learn-table th{background:#f8fafc;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.action-table td,.learn-table td{font-size:12.5px;color:#0f172a;line-height:1.7}
.bullet-list{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.learn-table th:nth-child(1), .learn-table td:nth-child(1){width:16%}
.learn-table th:nth-child(2), .learn-table td:nth-child(2){width:10%}
.learn-table th:nth-child(3), .learn-table td:nth-child(3){width:28%}
.learn-table th:nth-child(4), .learn-table td:nth-child(4){width:30%}
.matrix-table{width:100%;border-collapse:collapse;border-spacing:0;table-layout:fixed}
.matrix-table th,.matrix-table td{border:1px solid var(--bdr);padding:10px 8px;vertical-align:top;text-align:left;background:#fff}
.matrix-table th{background:#f8fafc;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.matrix-table td{font-size:12px;color:#0f172a;line-height:1.5}
.matrix-role-cell{width:18%;font-weight:700}
.matrix-tag{display:block;font-size:10px;font-weight:800;color:#0f172a;margin-bottom:7px}
.matrix-questions{display:flex;flex-direction:column;gap:7px;font-size:11.5px;line-height:1.5}
.matrix-questions p{margin:0}
.matrix-module-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.module-chip{display:block;background:#f0f9ff;border:1px solid #bae6fd;border-radius:4px;padding:4px 6px;font-size:10px;color:#0f172a;line-height:1.6}
.module-chip a{color:#0f172a;text-decoration:underline;text-decoration-thickness:1.2px;text-underline-offset:2px;word-break:break-word}
.module-chip a:hover{color:#1d4ed8}
.breakdown-card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r2);box-shadow:var(--sh);padding:16px 16px 10px}
.breakdown-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;align-items:center}
.breakdown-svg-wrap{overflow-x:auto}
.breakdown-svg{width:100%;min-width:700px;height:auto;display:block;background:#fff}
.breakdown-legend{display:flex;flex-direction:column;gap:7px;justify-content:center;padding-top:4px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#1e293b;line-height:1.3}
.legend-swatch{width:10px;height:10px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(15,23,42,.08)}
.chart-card{background:#fff;border-radius:var(--r3);box-shadow:var(--sh3);overflow:hidden;border:1px solid var(--bdr)}
.chart-svg{width:100%;display:block}
.chart-hint{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-top:1px solid var(--bdr);font-size:11.5px;color:var(--muted)}
.pulse{width:7px;height:7px;border-radius:50%;background:#f97316;animation:px 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes px{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.6);opacity:1}}
.cnode{cursor:pointer}
.cnode .nring{opacity:0;transition:opacity .2s}
.cnode:hover .nring{opacity:1}

/* DETAIL VIEWS */
#v-cluster,#v-shape{padding:20px;max-width:1440px;margin:0 auto}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bdr);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--mid);background:var(--surf);margin-bottom:14px;transition:all .15s}
.back-btn:hover{background:#f1f5f9;border-color:#94a3b8;color:#0f172a}

/* HERO */
.hero{border-radius:var(--r3);padding:22px 26px;box-shadow:var(--sh3);position:relative;overflow:hidden;margin-bottom:14px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.42),rgba(0,0,0,.1));pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-num{font-size:52px;font-weight:900;color:#fff;letter-spacing:-3px;line-height:1;flex-shrink:0}
.hero-num sub{font-size:20px;color:rgba(255,255,255,.4);font-weight:300;letter-spacing:0}
.hero-div{width:1px;height:50px;background:rgba(255,255,255,.2);flex-shrink:0}
.hero-meta{flex:1;min-width:140px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:#fff;margin-bottom:9px}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.hs-k{font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px}
.hs-v{font-size:17px;font-weight:800;color:#fff}

/* MATURITY STRIP */
.mstrip{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:13px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.ms-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
.ms-track{height:24px;border-radius:6px;display:flex;overflow:hidden;position:relative}
.ms-z{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800}
.ms-pin{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:3px;z-index:5;transform:translateX(-50%);transition:left .7s cubic-bezier(.4,0,.2,1)}
.ms-pin::before{content:attr(data-s);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;white-space:nowrap}
.ms-ticks{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--sub)}

/* LAYOUT */
.grid3{display:grid;grid-template-columns:190px 1fr 250px;gap:12px;margin-bottom:14px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.grid2r{display:grid;grid-template-columns:200px 1fr;gap:12px;margin-bottom:14px;align-items:start}

/* CARD */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh)}
.card-h{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-h::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* THEME CARD */
.tc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);text-align:center}
.tc-n{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;line-height:1.3}
.tc-v{font-size:26px;font-weight:900;line-height:1;margin-bottom:5px}
.tc-b{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.tc-bar{height:4px;background:#e2e8f0;border-radius:2px;margin-top:10px;overflow:hidden}
.tc-fill{height:100%;border-radius:2px;width:0;transition:width .9s ease}

/* ATTR BARS */
.alist{display:flex;flex-direction:column;gap:9px}
.ai{border-bottom:1px solid #f8fafc;padding-bottom:9px}
.ai:last-child{border-bottom:none;padding-bottom:0}
.ai-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ai-n{flex:1;font-size:11.5px;color:#1e293b;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ai-rt{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ai-d{font-size:9.5px;font-weight:700}
.ai-s{font-size:13px;font-weight:900}
.ai-b{font-size:9px;font-weight:700;padding:1px 6px;border-radius:999px}
.ai-tr{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.ai-f{height:100%;border-radius:4px;width:0;transition:width .9s ease}
.warn{font-size:8px;font-weight:800;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:999px;padding:1px 5px;white-space:nowrap}

/* SHAPE CARDS */
.slist{display:flex;flex-direction:column;gap:7px}
.sc{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 13px;cursor:pointer;transition:all .18s;position:relative}
.sc:hover{border-color:#93c5fd;box-shadow:var(--sh2);transform:translateX(2px)}
.sc-row{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.sc-nm{font-size:12px;font-weight:700;color:#0f172a;flex:1;line-height:1.3}
.sc-rt{display:flex;align-items:center;gap:5px;flex-shrink:0}
.sc-sc{font-size:15px;font-weight:900}
.sc-lv{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px}
.sc-sgl{font-size:10.5px;color:var(--muted);margin-top:2px}
.sc-bar{height:4px;background:#e2e8f0;border-radius:2px;margin-top:7px;overflow:hidden}
.sc-f{height:100%;border-radius:2px;width:0;transition:width .9s ease}
.sc-arr{position:absolute;right:10px;bottom:9px;color:var(--sub);font-size:14px}

/* RANKING */
.ritem{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f8fafc;font-size:12px}
.ritem:last-child{border-bottom:none}
.r-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e293b}
.r-bw{width:130px;flex-shrink:0}
.r-tr{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.r-f{height:100%;border-radius:3px;width:0;transition:width .9s ease}
.r-sc{width:28px;text-align:right;font-weight:800;flex-shrink:0;font-size:12px}
.r-lv{font-size:9px;font-weight:700;padding:1px 6px;border-radius:999px;text-align:center;flex-shrink:0}

/* GAP */
.gap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gap-box{border-radius:var(--r);border:1px solid;padding:12px 14px}
.gap-str{background:#f0fdf4;border-color:#86efac}
.gap-wk{background:#fef2f2;border-color:#fca5a5}
.gap-t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.gap-str .gap-t{color:#15803d}.gap-wk .gap-t{color:#b91c1c}
.gap-row2{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:4px}
.gap-row2:last-child{margin-bottom:0}
.gap-n{color:var(--mid)}
.gap-str .gap-v{color:#16a34a;font-weight:800}
.gap-wk .gap-v{color:#dc2626;font-weight:800}

/* INFO BOXES */
.ibox{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid #3b82f6;border-radius:var(--r2);padding:13px 16px;margin-bottom:12px}
.ibox h4{font-size:11px;font-weight:800;color:#1d4ed8;margin-bottom:6px}
.ibox p{font-size:12.5px;color:#0f172a;line-height:1.7}
.abox{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:var(--r2);padding:13px 16px;margin-bottom:16px}
.abox h4{font-size:11px;font-weight:800;color:#92400e;margin-bottom:9px}
.act{display:flex;gap:10px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #fef3c7}
.act:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.act-n{width:22px;height:22px;background:#f59e0b;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.act-t{font-size:12.5px;color:#0f172a;line-height:1.65}

/* COMPARE BARS */
.cbar-item{margin-bottom:10px}
.cbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cbar-nm{font-size:11px;color:#1e293b;display:flex;align-items:center;gap:4px}
.cbar-vals{display:flex;align-items:center;gap:8px;font-size:11px}
.cbar-tracks{display:flex;flex-direction:column;gap:2px}
.cbar-tr{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.cbar-tr2{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden}
.cbar-f{height:100%;border-radius:4px;width:0;transition:width .9s ease}

/* RESPONSIVE */
@media(max-width:960px){.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.grid2r{grid-template-columns:1fr}.focus-grid{grid-template-columns:1fr}}

function radar(scores, color, sz) {
  sz = sz || 180;
  const cx=sz/2, cy=sz/2, R=sz*0.32;
  const n=scores.map(s=>Math.max(0,Math.min(1,(+s-1)/3)));
  const pts=[[cx,cy-n[0]*R],[cx+n[1]*R,cy],[cx,cy+n[2]*R],[cx-n[3]*R,cy]];
  let h=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="display:block;overflow:visible">`;
  [1,2,3].forEach(i=>{const r=R*i/3;h+=`<polygon points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy+r} ${cx-r},${cy}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;});
  [[cx,cy-R],[cx+R,cy],[cx,cy+R],[cx-R,cy]].forEach(([x,y])=>h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`);
  h+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${color}20" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(([x,y])=>h+=`<circle cx="${x}" cy="${y}" r="4" fill="${color}" stroke="white" stroke-width="1.5"/>`);
  const lp=[{x:cx,y:cy-R-13,a:'middle'},{x:cx+R+13,y:cy+4,a:'start'},{x:cx,y:cy+R+16,a:'middle'},{x:cx-R-13,y:cy+4,a:'end'}];
  const sp=[{x:cx,y:cy-R-25,a:'middle'},{x:cx+R+28,y:cy+4,a:'start'},{x:cx,y:cy+R+28,a:'middle'},{x:cx-R-28,y:cy+4,a:'end'}];
  TS.forEach((t,i)=>{
    h+=`<text x="${lp[i].x}" y="${lp[i].y}" text-anchor="${lp[i].a}" font-size="10" font-weight="800" fill="#64748b" font-family="Segoe UI,sans-serif">${t}</text>`;
    h+=`<text x="${sp[i].x}" y="${sp[i].y}" text-anchor="${sp[i].a}" font-size="11" font-weight="900" fill="${color}" font-family="Segoe UI,sans-serif">${(+scores[i]).toFixed(1)}</text>`;
  });
  return h+'</svg>';
}

function scoreX(score) {
  return 75 + ((Math.max(1, Math.min(4, +score)) - 1) / 3) * 1000;
}

function pointOnCurve(score) {
  const path = document.getElementById('maturity-curve-path');
  if (!path) return {x: scoreX(score), y: 360};
  const targetX = scoreX(score);
  const total = path.getTotalLength();
  let lo = 0;
  let hi = total;
  for (let i = 0; i < 25; i += 1) {
    const mid = (lo + hi) / 2;
    const point = path.getPointAtLength(mid);
    if (point.x < targetX) lo = mid;
    else hi = mid;
  }
  return path.getPointAtLength((lo + hi) / 2);
}

function showCluster(cid) {
  const cl=CL.find(c=>c.id===cid);
  if(!cl) return;
  _cc=cl;
  setBC(`<button class="bc-link" onclick="showHome()">Hub Overview</button><span class="bc-sep">›</span><span class="bc-cur">${cl.name}</span>`);
  const diff=(cl.score-HUB.score), diffPos=diff>=0;
  const html=`
    <button class="back-btn" onclick="showHome()">← Back to Chart</button>
    <div class="hero" style="background:linear-gradient(135deg,${adj(cl.color,-45)},${cl.color})">
      <div class="hero-in">
        <div class="hero-num">${cl.score.toFixed(2)}<sub>/4</sub></div>
        <div class="hero-div"></div>
        <div class="hero-meta">
          <div class="hero-badge">⬡ ${cl.name} — ${lv(cl.score).n}</div>
          <div class="hero-stats">
            <div><div class="hs-k">Shapes</div><div class="hs-v">${cl.shapes.length}</div></div>
            <div><div class="hs-k">vs Hub</div><div class="hs-v" style="color:${diffPos?'#86efac':'#fca5a5'}">${diffPos?'▲':'▼'}${Math.abs(diff).toFixed(2)}</div></div>
            <div><div class="hs-k">AI Score</div><div class="hs-v" style="color:${cl.attrs[3]<=1.5?'#fca5a5':'#86efac'}">${cl.attrs[3].toFixed(2)}</div></div>
            <div><div class="hs-k">Level</div><div class="hs-v">${lv(cl.score).s}</div></div>
          </div>
        </div>
        <div style="flex-shrink:0">${radar(cl.themes,cl.color,165)}</div>
      </div>
    </div>
    ${strip(cl.score,cl.color)}
    <div class="grid4">${TN.map((t,i)=>tcCard(t,cl.themes[i],cl.color)).join('')}</div>
    <div class="grid3">
      <div class="card">
        <div class="card-h">Theme Radar</div>
        <div style="display:flex;justify-content:center">${radar(cl.themes,cl.color,185)}</div>
        <div style="margin-top:12px">
          ${TN.map((t,i)=>{const l=lv(cl.themes[i]);return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11.5px">
            <div style="width:3px;height:13px;border-radius:2px;background:${cl.color};flex-shrink:0"></div>
            <div style="flex:1;color:var(--mid)">${TS[i]}</div>
            <div style="font-weight:800;color:${l.f}">${(+cl.themes[i]).toFixed(2)}</div>
            <div style="font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px;background:${l.bg};color:${l.c};border:1px solid ${l.bd}">${l.s}</div>
          </div>`;}).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-h">Parameters vs Hub Average</div>
        <div class="alist">${AN.map((n,i)=>attrRow(n,cl.attrs[i],HUB.attrs[i],cl.color)).join('')}</div>
      </div>
      <div>
        <div class="card">
          <div class="card-h">Shapes (${cl.shapes.length})</div>
          <div class="slist">${cl.shapes.map((sh,i)=>shapeCard(sh,cl.color,cl.id,i)).join('')}</div>
        </div>
      </div>
    </div>
    ${cl.shapes.length>1?ranking(cl.shapes,cl.color):''}
    ${gapBox(cl.attrs)}
    <div class="ibox"><h4>💡 Cluster Insights</h4><p>${insight({name:cl.name,score:cl.score,attrs:cl.attrs})}</p></div>
    <div class="abox"><h4>🎯 Top Action Priorities — ${cl.name}</h4>${actions(cl.attrs)}</div>`;

function showShape(cid, idx) {
  const cl=CL.find(c=>c.id===cid);
  if(!cl) return;
  const sh=cl.shapes[idx];
  if(!sh) return;
  const nm=sh.name.length>28?sh.name.slice(0,28)+'…':sh.name;
  setBC(`<button class="bc-link" onclick="showHome()">Hub Overview</button><span class="bc-sep">›</span><button class="bc-link" onclick="showCluster('${cid}')">${cl.name}</button><span class="bc-sep">›</span><span class="bc-cur">${nm}</span>`);
  const diff=(sh.score-cl.score), diffPos=diff>=0;
  const hdiff=(sh.score-HUB.score), hdiffPos=hdiff>=0;
  const compBars=AN.map((n,i)=>{
    const sv=sh.attrs[i], hv=HUB.attrs[i], l=lv(sv), isGap=sv<=1.5;
    return `<div class="cbar-item">
      <div class="cbar-top">
        <div class="cbar-nm">${n}${isGap?'<span class="warn">⚠</span>':''}</div>
        <div class="cbar-vals"><span style="color:var(--muted)">Hub ${hv.toFixed(1)}</span><span style="font-weight:900;color:${l.f}">${(+sv).toFixed(1)}</span><span style="font-size:9px;font-weight:700;background:${l.bg};color:${l.c};border:1px solid ${l.bd};border-radius:999px;padding:1px 6px">${l.s}</span></div>
      </div>
      <div class="cbar-tracks">
        <div class="cbar-tr"><div class="cbar-f" data-w="${wPct(sv)}" style="background:${cl.color}"></div></div>
        <div class="cbar-tr2"><div class="cbar-f" data-w="${wPct(hv)}" style="background:#94a3b8;opacity:.5"></div></div>
      </div>
    </div>`;
  }).join('');
  const html=`
    <button class="back-btn" onclick="showCluster('${cid}')">← Back to ${cl.name}</button>
    <div class="hero" style="background:linear-gradient(135deg,${adj(cl.color,-50)},${cl.color})">
      <div class="hero-in">
        <div style="flex:1;min-width:180px">
          <div style="font-size:19px;font-weight:900;color:#fff;margin-bottom:7px;line-height:1.2">${sh.name}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap">
            ${sh.sgl!=='—'?`<div><div class="hs-k">SGL</div><div class="hs-v" style="font-size:13px">${sh.sgl}</div></div>`:''}
            ${sh.owner!=='—'?`<div><div class="hs-k">Shape Owner</div><div class="hs-v" style="font-size:13px">${sh.owner}</div></div>`:''}
            <div><div class="hs-k">Cluster</div><div class="hs-v" style="font-size:13px">${cl.name}</div></div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="hero-num">${(+sh.score).toFixed(1)}<sub>/4</sub></div>
          <div style="margin-top:6px">${lvBadge(sh.score)}</div>
          <div style="margin-top:5px;font-size:11px;color:rgba(255,255,255,.6)">
            vs cluster: <span style="color:${diffPos?'#86efac':'#fca5a5'};font-weight:700">${diffPos?'▲':'▼'}${Math.abs(diff).toFixed(2)}</span>
            &nbsp;|&nbsp; vs hub: <span style="color:${hdiffPos?'#86efac':'#fca5a5'};font-weight:700">${hdiffPos?'▲':'▼'}${Math.abs(hdiff).toFixed(2)}</span>
          </div>
        </div>
      </div>
    </div>
    ${strip(sh.score,cl.color)}
    <div class="grid4">${TN.map((t,i)=>tcCard(t,sh.themes[i],cl.color)).join('')}</div>
    <div class="grid2">
      <div class="card">
        <div class="card-h">Theme Radar</div>
        <div style="display:flex;justify-content:center">${radar(sh.themes,cl.color,195)}</div>
      </div>
      <div class="card">
        <div class="card-h">Parameters — Shape vs Hub Average <span style="font-weight:400;color:var(--sub);font-size:9px">(solid = shape · faint = hub)</span></div>
        ${compBars}
      </div>
    </div>
    ${gapBox(sh.attrs)}
    <div class="ibox"><h4>💡 Shape Insights</h4><p>${insight({name:sh.name,score:sh.score,attrs:sh.attrs})}</p></div>`;
  go('v-shape',html);
}
